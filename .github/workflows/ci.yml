name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            builder-target: --win nsis zip
          - name: Linux
            os: ubuntu-22.04
            builder-target: --linux
          - name: macOS (Apple Silicon)
            os: macos-14
            builder-target: --mac --arm64
            mac-arch: arm64
          - name: macOS (Intel)
            os: macos-15-intel
            builder-target: --mac --x64
            mac-arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ---- CI 缓存优化：npm 依赖下载缓存（按平台 + lock 文件区分，避免失效污染）----
      - name: Cache npm (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache npm (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Electron 二进制缓存：install.js 下载的解压产物（Electron 体积大，命中可省大量时间）
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: node_modules/electron/dist
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install Python setuptools
        if: runner.os != 'macOS'
        run: python3 -m pip install setuptools

      - name: Install Python setuptools (macOS)
        if: runner.os == 'macOS'
        run: python3 -m pip install setuptools --break-system-packages

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Remove problematic cpu-features (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path node_modules\cpu-features) {
            Remove-Item -Recurse -Force node_modules\cpu-features
          }
          if (Test-Path node_modules\ssh2\node_modules\cpu-features) {
            Remove-Item -Recurse -Force node_modules\ssh2\node_modules\cpu-features
          }

      - name: Remove problematic cpu-features (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf node_modules/cpu-features
          rm -rf node_modules/ssh2/node_modules/cpu-features

      - name: Remove problematic cpu-features (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf node_modules/cpu-features
          rm -rf node_modules/ssh2/node_modules/cpu-features

      # ---- 测试与覆盖率：Linux 上额外生成覆盖率报告（用于上传可视化）----
      - name: Run unit tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Run unit tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Run integration tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run test:integration:coverage

      - name: Rebuild native modules
        run: npx electron-builder install-app-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main
        run: npx electron-vite build

      # CI 用 --ignore-scripts 安装，跳过了 electron 的 postinstall，导致二进制未下载。
      # 这里显式触发 electron 安装脚本下载二进制（会读取 .npmrc 的 electron_mirror 镜像）。
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Electron 测试复用其自带二进制，无需下载 Chromium。
      # Linux 上用 install-deps 安装运行 Electron 所需的系统库（Chromium 依赖即覆盖 Electron 运行库）。
      # 另装 xvfb：Electron 在 Linux 上即使 headless 也仍需一个显示服务器来初始化。
      - name: Install Playwright system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb

      - name: Install Playwright (Windows/macOS)
        if: runner.os != 'Linux'
        run: npx playwright install

      - name: Run E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
        env:
          E2E_HEADLESS: '1'

      - name: Run E2E tests (Linux, via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_HEADLESS: '1'

      # ---- 测试报告与覆盖率可视化（仅 Linux，避免矩阵 4 平台重复上传）----
      - name: Print coverage summary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "== Unit coverage (tests/coverage/unit) =="
          if [ -f tests/coverage/unit/coverage-summary.json ]; then
            node -e "const c=require('./tests/coverage/unit/coverage-summary.json').total; \
              console.log('lines:', c.lines.pct + '%  statements:', c.statements.pct + '%  functions:', c.functions.pct + '%  branches:', c.branches.pct + '%')"
          fi
          echo "== Integration coverage (tests/coverage/integration) =="
          if [ -f tests/coverage/integration/coverage-summary.json ]; then
            node -e "const c=require('./tests/coverage/integration/coverage-summary.json').total; \
              console.log('lines:', c.lines.pct + '%  statements:', c.statements.pct + '%  functions:', c.functions.pct + '%  branches:', c.branches.pct + '%')"
          fi

      - name: Upload test reports and coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            tests/report/
            tests/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build packages
        run: npx electron-builder ${{ matrix.builder-target }} --config electron-builder.yml --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS DMG artifact
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          dmg_files=(release/*${{ matrix.mac-arch }}.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "Expected macOS ${{ matrix.mac-arch }} DMG was not generated"
            ls -la release
            exit 1
          fi

      # 每个安装包一个独立 artifact，下载下来就是单独的包
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: release/*-portable.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: release/*.deb
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux snap
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-snap
          path: release/*.snap
          retention-days: 7
          if-no-files-found: error

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.mac-arch }}-dmg
          path: release/*${{ matrix.mac-arch }}.dmg
          retention-days: 7
          if-no-files-found: error

  # Electron 38 构建的包在 Ubuntu 24.04 上无法运行，降级 Electron 35 单独构建一版兼容包
  build-ubuntu24:
    name: CI Linux (Ubuntu 24 compatible)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ---- CI 缓存优化：npm 依赖下载缓存（build-ubuntu24 为纯 Linux，走 ~/.npm）----
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-ubuntu24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-ubuntu24-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install Python setuptools
        run: python3 -m pip install setuptools

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Downgrade Electron to 35 for Ubuntu 24 compatibility
        run: npm install electron@35.7.5 --save-dev

      # Electron 35 二进制缓存：与 build job 的 Electron 38 缓存 key 区分，避免互串
      - name: Cache Electron binary (Electron 35)
        uses: actions/cache@v4
        with:
          path: node_modules/electron/dist
          key: electron-ubuntu24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-ubuntu24-

      - name: Remove problematic cpu-features
        run: |
          rm -rf node_modules/cpu-features
          rm -rf node_modules/ssh2/node_modules/cpu-features

      # ---- 测试与覆盖率：Linux 上额外生成覆盖率报告（用于上传可视化）----
      - name: Run unit tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Run unit tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Run integration tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run test:integration:coverage

      - name: Rebuild native modules
        run: npx electron-builder install-app-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main
        run: npx electron-vite build

      # 确保 Electron 35 二进制已就绪（--ignore-scripts 可能跳过了下载）
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Linux 上用 install-deps 补齐 Electron 运行所需的系统库；
      # 另装 xvfb：Electron 在 Linux 上即使 headless 也仍需一个显示服务器来初始化。
      - name: Install Playwright system deps
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb

      - name: Run E2E tests (Linux, via xvfb)
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_HEADLESS: '1'

      # ---- 测试报告与覆盖率可视化 ----
      - name: Print coverage summary
        shell: bash
        run: |
          echo "== Unit coverage (tests/coverage/unit) =="
          if [ -f tests/coverage/unit/coverage-summary.json ]; then
            node -e "const c=require('./tests/coverage/unit/coverage-summary.json').total; \
              console.log('lines:', c.lines.pct + '%  statements:', c.statements.pct + '%  functions:', c.functions.pct + '%  branches:', c.branches.pct + '%')"
          fi
          echo "== Integration coverage (tests/coverage/integration) =="
          if [ -f tests/coverage/integration/coverage-summary.json ]; then
            node -e "const c=require('./tests/coverage/integration/coverage-summary.json').total; \
              console.log('lines:', c.lines.pct + '%  statements:', c.statements.pct + '%  functions:', c.functions.pct + '%  branches:', c.branches.pct + '%')"
          fi

      - name: Upload test reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ubuntu24
          path: |
            tests/report/
            tests/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build package (Linux Ubuntu 24)
        run: npx electron-builder --linux AppImage deb --config electron-builder.yml --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Ubuntu 24 artifacts
        run: |
          cd release
          for f in *.AppImage; do mv "$f" "${f%.AppImage}-ubuntu24.AppImage"; done
          for f in *.deb; do mv "$f" "${f%.deb}-ubuntu24.deb"; done

      - name: Upload Ubuntu 24 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu24-x64-appimage
          path: release/*-ubuntu24.AppImage
          retention-days: 7
          if-no-files-found: error

      - name: Upload Ubuntu 24 deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu24-x64-deb
          path: release/*-ubuntu24.deb
          retention-days: 7
          if-no-files-found: error
