appId: com.superstudio.base-desktop-app
productName: Base Desktop App
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# 托盘图标随包携带（TrayManager 经 process.resourcesPath 解析）
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  extraResources:
    - from: build/iconTemplate.png
      to: iconTemplate.png
    - from: build/iconTemplate@2x.png
      to: iconTemplate@2x.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  writeUpdateInfo: false
