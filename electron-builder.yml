appId: superconnectx.superstudio
productName: superconnectx
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - '!out/**/*.map'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/{CHANGELOG.md,README.md,readme.md,test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/.bin'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: resources/exe/setup.exe
    to: exe/setup.exe
asarUnpack:
  - node_modules/serialport/**
  - node_modules/@serialport/**
win:
  executableName: SuperConnectX
  # 平台级命名作用于 zip 便携包；nsis 安装包由下方 nsis.artifactName 覆盖
  artifactName: ${name}-${version}-windows-x64-portable.${ext}
nsis:
  artifactName: ${name}-${version}-windows-x64-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: SuperStudio
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-x64.${ext}
deb:
  artifactName: ${name}-${version}-linux-x64.${ext}
snap:
  artifactName: ${name}-${version}-linux-x64.${ext}
afterPack: ./scripts/afterPack.js
npmRebuild: true
publish:
  provider: github
  owner: SuperStudio
  repo: SuperConnectX
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
